# North Star FC — WordPress POC Build Plan
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO USE THIS FILE
#   - status values: pending | in-progress | done | blocked
#   - type values:   human (requires manual action) | ai (Claude executes this)
#   - At the start of each session, Claude reads this file to find the first
#     phase/task that is NOT done and picks up from there.
#   - Claude updates status fields as work completes.
#   - Phases must be completed in order. Tasks within a phase can run in
#     parallel unless marked with depends_on.
# ─────────────────────────────────────────────────────────────────────────────
# STARTING FRESH ON A NEW MAC?
#   1. Copy this entire project folder to your new machine (or clone from git)
#   2. Open this folder in Claude Code
#   3. Ask: "What do I need to install to get started?"
#      Claude will read Phase 0 below and walk you through it step by step.
#   4. Once Phase 0 is done, say "run Phase 1" and Claude handles the rest.
# ─────────────────────────────────────────────────────────────────────────────
# ALL PHASES BELOW DONE?
#   Check location-scoping-plan.md (same directory) for active follow-on
#   work — a separate tracking file, started 2026-08-14, not part of this
#   phase list.
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: North Star FC
  site_url: https://northstar-testing.ddev.site
  theme_slug: nsfc-child
  parent_theme: kadence
  text_domain: nsfc

# ─────────────────────────────────────────────────────────────────────────────
# ADDENDUM (2026-08-10) — SCOPE CHANGE: multi-location support
#
# This build plan and wordpress/CLAUDE.md were written for a Rochester-only POC
# ("No :location segment for the POC — Rochester only"). The user redirected mid-build:
# this needs to support all 4 North Star FC locations (Rochester, Austin, Albert Lea,
# Winona), as a step toward this becoming the real site rather than staying a POC.
#
# Restructured after Phase 10 was already complete, without redoing any of the real
# content already built:
#   - Added austin/albert-lea/winona terms to the program_location taxonomy
#     (previously only had `rochester`).
#   - Added a :location URL segment. Since WordPress pages derive their URL from the
#     post_parent chain automatically, this was mostly a re-parenting operation: created
#     a new "Rochester" page and moved the existing Competitive/Recreational/Camps/
#     Find-Your-Program pages (and everything nested under them — season pages, Phase 7
#     sub-program pages, camp listing pages) to be children of it. Every one of those
#     ~30 pages automatically picked up a /rochester/ URL segment with zero content
#     changes needed.
#   - Fixed season-landing.php to be genuinely location-aware rather than just
#     Rochester-shaped: added a `_nsfc_location` page-meta field (alongside the existing
#     `_nsfc_season`/`_nsfc_level`), added program_location to the season toggle's
#     program query, and fixed the season-toggle URL helper
#     (previously hardcoded `youth-soccer/{level}/{season}`, now
#     `youth-soccer/{location}/{level}/{season}`). This was a latent bug fix, not just
#     a rename — without it, adding real Austin programs later would have made them
#     bleed onto Rochester's season pages too.
#   - Built Austin/Albert Lea/Winona location trees: each gets a location hub page +
#     Competitive/Recreational/Camps fallback pages linking to northstarfc.com — no real
#     program data exists for these 3 locations anywhere in this repo (no equivalent of
#     competitiveSeasons.js/recreationalPrograms.js), so fallback cards are what's
#     honestly buildable right now. This mirrors the React prototype's own existing
#     behavior for non-Rochester locations. These are meant to be swapped for real
#     season-landing.php + program CPT content once real per-location data is provided —
#     the taxonomy and templates are already set up for that, not just visually patched.
#   - Turned /youth-soccer/ itself into a 4-location chooser page. (Leftover language in
#     wordpress/CLAUDE.md — "/youth-soccer/ → location chooser" — didn't make sense under
#     the Rochester-only scope; it does now.)
#   - Updated the primary nav's Youth Soccer dropdown: Rochester now links to the new
#     Rochester hub instead of the chooser page; Austin/Albert Lea/Winona changed from
#     external northstarfc.com links to internal pages.
#   - Updated Home page's location grid: all 4 cards now link internally (previously
#     only Rochester did).
#   - Bulk-fixed every hardcoded internal `/youth-soccer/...` link built across Phases 3,
#     6, 7, 8, and 9 to include the /rochester/ segment — done via a precise PHP
#     str_replace pass (not a blind db-wide search-replace), because the Home page
#     needed two different outcomes for two identical-looking href="/youth-soccer/"
#     strings: its "Youth Soccer" card must keep pointing at the new chooser, while its
#     "Rochester" card needed to become location-specific. A blanket replace would have
#     gotten one of those wrong.
#   - Verified: 19 spot-checked URLs across all 4 locations return HTTP 200, and a
#     database-wide sweep confirms zero remaining un-migrated /youth-soccer/competitive|
#     recreational|camps|find-your-program links anywhere.
#
# Not done: real program content for Austin/Albert Lea/Winona. That requires real data
# this repo doesn't have — same constraint that blocked Tryouts/UPSL rosters in Phase 6.
# ─────────────────────────────────────────────────────────────────────────────

phases:

  # ───────────────────────────────────────────────────────────────────────────
  - id: 0
    name: Prerequisites
    goal: Install the software needed to run the local environment on a fresh Mac.
    type: human
    status: done
    notes: >
      Complete all tasks in order. Claude cannot do this phase — it requires
      installing software on your Mac. All tools are free. Total time: ~15 minutes
      (mostly download time). Everything runs locally — no accounts or subscriptions needed.
    tasks:
      - id: "0.1"
        name: Install Homebrew (Mac package manager)
        status: done
        type: human
        note: Skip this step if you already have Homebrew (run `brew --version` to check).
        commands:
          - /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        verify: brew --version

      - id: "0.2"
        name: Install OrbStack (lightweight Docker for Mac)
        status: done
        type: human
        url: https://orbstack.dev
        note: >
          Download from orbstack.dev, drag to Applications, open it once.
          It will ask for your password to set up the network layer — that is normal.
          OrbStack is free for personal use and much lighter than Docker Desktop.
        verify: Open OrbStack and confirm it shows "Running" in the menu bar.

      - id: "0.3"
        name: Install DDEV (local WordPress server manager)
        status: done
        type: human
        commands:
          - brew install ddev/ddev/ddev
        verify: ddev version

      - id: "0.4"
        name: Install Composer (PHP package manager)
        status: done
        type: human
        commands:
          - brew install composer
        note: Needed to install Carbon Fields (the free structured-content library).
        verify: composer --version

      - id: "0.5"
        name: Verify all installs
        status: done
        type: human
        commands:
          - brew --version
          - ddev version
          - composer --version
        note: All three should print a version number. If any fail, ask Claude to help troubleshoot before moving to Phase 1.

  # ───────────────────────────────────────────────────────────────────────────
  - id: 1
    name: WordPress Install
    goal: Initialize DDEV, download WordPress, and install all required plugins.
    type: ai
    status: done
    depends_on: 0
    notes: >
      Claude runs setup.sh from the wordpress/ directory. After this phase
      the site is accessible at https://nsfc.ddev.site.

      ADDENDUM (discovered during Phase 6): this build plan has no task anywhere
      that actually loads Bootstrap 5 CSS/JS on the site. CLAUDE.md assumed it
      would be "loaded via Kadence," but Kadence ships its own unrelated CSS
      framework, not Bootstrap — every template built in Phases 4/5/6 (single-program.php,
      season-landing.php, archive-camp-session.php, all Bootstrap-class-based markup)
      was rendering completely unstyled until this was caught. Fixed by enqueueing
      Bootstrap 5.3.3 CSS + JS bundle via jsdelivr CDN in functions.php (user chose
      CDN over self-hosting). This belongs conceptually in Phase 1/theme setup even
      though it was caught later.
    tasks:
      - id: "1.1"
        name: Start DDEV and download WordPress core
        status: done
        type: ai
        commands:
          - ddev start
          - ddev wp core download
          - ddev wp config create --dbname=db --dbuser=db --dbpass=db --dbhost=db
          - >
            ddev wp core install
            --url=https://nsfc.ddev.site
            --title="North Star FC"
            --admin_user=admin
            --admin_password=admin
            --admin_email=admin@nsfc.ddev.site
            --skip-email
        note: >
          This DDEV version auto-generates wp-config.php on `ddev start`/`wp core
          download`, so `wp config create` errored ("file already exists") — the
          auto-generated file is already correctly wired to the DDEV DB via
          wp-config-ddev.php, so that step was skipped and install proceeded directly.

      - id: "1.2"
        name: Set pretty permalinks
        status: done
        type: ai
        commands:
          - ddev wp rewrite structure '/%postname%/'
          - ddev wp rewrite flush

      - id: "1.3"
        name: Install and activate free plugins
        status: done
        type: ai
        commands:
          - ddev wp plugin install kadence-blocks --activate
          - ddev wp plugin install custom-post-type-ui --activate
          - ddev wp plugin install wordpress-seo --activate
          - ddev wp plugin install tablepress --activate
          - ddev wp plugin install wpforms-lite --activate

      - id: "1.4"
        name: Install Carbon Fields via Composer
        status: done
        type: ai
        commands:
          - ddev composer require htmlburger/carbon-fields
        note: Carbon Fields is a library — it loads via the child theme's functions.php, not as a WP plugin.

      - id: "1.5"
        name: Install and activate parent + child theme
        status: done
        type: ai
        commands:
          - ddev wp theme install kadence --activate
          - ddev wp theme activate nsfc-child
        note: nsfc-child must be in wp-content/themes/ before activating.

      - id: "1.6"
        name: Disable default plugins and content
        status: done
        type: ai
        commands:
          - ddev wp plugin deactivate hello akismet
          - ddev wp post delete 1 2 --force

  # ───────────────────────────────────────────────────────────────────────────
  - id: 2
    name: Custom Post Types & Taxonomies
    goal: Register the program and camp_session CPTs plus all taxonomies.
    type: ai
    status: done
    depends_on: 1
    deliverables:
      - wp-content/themes/nsfc-child/inc/cpt.php
      - wp-content/themes/nsfc-child/inc/taxonomies.php
      - wp-content/themes/nsfc-child/inc/carbon-fields.php
    tasks:
      - id: "2.1"
        name: Write CPT registration (program, camp_session)
        status: done
        type: ai
        note: >
          Register two CPTs with show_in_rest, has_archive, hierarchical=false.
          program slug: program. camp_session slug: camp-session.
          Both support title, editor, custom-fields, thumbnail.
          Code already existed in wp-content/themes/nsfc-child/inc/cpt.php (pre-built
          scaffold) — verified via `ddev wp post-type list` that both `program` and
          `camp-session` are registered correctly with no PHP errors.

      - id: "2.2"
        name: Write taxonomy registration
        status: done
        type: ai
        taxonomies:
          - slug: season
            label: Season
            terms: [spring-summer, fall, winter]
            post_types: [program, camp-session]
          - slug: program_level
            label: Level
            terms: [competitive, recreational]
            post_types: [program, camp-session]
          - slug: program_location
            label: Location
            terms: [rochester]
            post_types: [program, camp-session]

      - id: "2.3"
        name: Write Carbon Fields field groups
        status: done
        type: ai
        note: >
          Code already existed in wp-content/themes/nsfc-child/inc/carbon-fields.php
          (pre-built scaffold) — verified it registers without PHP fatal errors
          against the live Carbon Fields install.
        field_groups:
          programs:
            post_type: program
            fields:
              - [text] age_label
              - [text] date_range
              - [checkbox] tryout_required
              - [text] cost_text
              - [text] format
              - [text] venue
              - [text] registration_url_boys
              - [text] registration_url_girls
              - [text] registration_url_team
              - [text] registration_url_individual
              - [text] registration_window
              - [text] registration_note
              - [checkbox] show_financial_aid
              - [checkbox] has_coaching
              - [text] coaching_note
              - [text] coaching_contact_label
              - [url] coaching_contact_href
              - [textarea] notes
              - [text] external_link_label
              - [url] external_link_url
              - [repeater] costs → [text] grade, [text] cost
              - [repeater] cost_tiers → [text] tier_label, [repeater] tier_costs → [text] grade, [text] cost
              - [repeater] sessions → [text] session_label, [text] session_dates, [text] session_cost, [text] session_note
              - [repeater] practice_nights → [text] grade, [text] nights
              - [group] schedule_practices → [text] day, [text] location, [text] dates
              - [group] schedule_games → [text] day, [text] kickoff, [text] location, [text] dates
          camp_sessions:
            post_type: camp-session
            fields:
              - [select] camp_type → options match prototype campTemplates keys
              - [text] date_label
              - [date] start_date
              - [date] end_date
              - [text] venue
              - [text] ages
              - [text] cost
              - [url] registration_url
              - [text] session_time

      - id: "2.4"
        name: Verify CPTs visible in WP Admin
        status: done
        type: human
        note: Open https://nsfc.ddev.site/wp-admin and confirm "Programs" and "Camp Sessions" appear in the left sidebar.

  # ───────────────────────────────────────────────────────────────────────────
  - id: 3
    name: Navigation & Menus
    goal: Set up the full site navigation matching the prototype.
    type: ai
    status: done
    depends_on: 2
    tasks:
      - id: "3.1"
        name: Create all site pages (stubs)
        status: done
        type: ai
        note: >
          Create WP pages for every URL in the site structure. Use WP-CLI.
          Pages that need parent-child hierarchy: youth-soccer > competitive,
          youth-soccer > recreational, youth-soccer > camps,
          adult-soccer, upsl > men + women, events (4 children),
          tryouts, soccer-store, club, resources.
          Created 17 stub pages via WP-CLI (empty content, correct slugs/parents).
          Events' "4 children" were not named in this task — cross-referenced
          existing-nav.md's "Tryouts & Events" section, excluding Tryouts and
          Camps (already separate top-level items elsewhere), leaving exactly
          4: 3v3 Fundraiser Tournament, Summer Tournament, Futsal Tournament,
          Birthday Parties. UPSL children slugs: mens-team, womens-team.

      - id: "3.2"
        name: Register nav menu locations in the theme
        status: done
        type: ai
        note: >
          Register primary and footer menu locations in functions.php.
          Already present in the pre-built scaffold (functions.php) — verified
          via `ddev wp menu location list`.

      - id: "3.3"
        name: Create the primary navigation menu via WP-CLI
        status: done
        type: ai
        note: >
          Create the "Primary" menu. Top-level items: Youth Soccer (dropdown),
          Adult Soccer, UPSL (dropdown: Men, Women), Tryouts, Events,
          Soccer Store, Club, Resources.
          Youth Soccer dropdown: Rochester (links to /youth-soccer/rochester placeholder),
          Austin, Albert Lea, Winona (all link to northstarfc.com for now).
          Rochester was linked to /youth-soccer/ instead of the placeholder
          /youth-soccer/rochester/ path, since Phase 12 (Location Hub Page) later
          decides the actual Rochester content lives at /youth-soccer/ for this
          single-location POC — /youth-soccer/rochester/ is never created, so the
          original placeholder path would have been a dead link.

      - id: "3.4"
        name: Verify navigation renders correctly
        status: done
        type: human
        note: Visit https://nsfc.ddev.site and confirm all nav items and dropdowns work on desktop and mobile.

  # ───────────────────────────────────────────────────────────────────────────
  - id: 4
    name: Program Detail Template
    goal: Build the single-program.php template that renders all program detail pages.
    type: ai
    status: done
    depends_on: 2
    deliverables:
      - wp-content/themes/nsfc-child/single-program.php
      - wp-content/themes/nsfc-child/template-parts/program-registration.php
      - wp-content/themes/nsfc-child/template-parts/program-schedule.php
    notes: >
      While verifying this phase, discovered and fixed two bugs in the Phase 2
      scaffold that had been silently broken since Phase 1: (1) functions.php's
      Composer autoload path was off by one directory level (looked for
      wp-content/vendor/autoload.php instead of wordpress/vendor/autoload.php),
      so Carbon_Fields::boot() was never actually executing — inc/carbon-fields.php's
      field registration never ran despite showing no PHP errors, meaning Phase
      2's "verified no PHP errors" check was a false positive. (2) inc/carbon-fields.php
      used Field::make('url', ...) in 7 places, but Carbon Fields core has no 'url'
      field type (only text/textarea/checkbox/select/date/complex/etc.) — this
      would have fataled the moment autoload was fixed. Changed all 7 to 'text'.
      Both fixes verified: Carbon_Fields class loads, carbon_fields_register_fields
      fires, carbon_set_post_meta() works, and a full test program post renders
      correctly end-to-end (see task 4.2/4.3). Also removed a third pre-existing
      bug from functions.php: add_filter('wpseo_breadcrumb_links', '__return_true')
      returned a boolean where Yoast expects the breadcrumb links array, which
      printed a PHP notice directly into every page's rendered HTML. The filter
      served no purpose (breadcrumbs render via direct yoast_breadcrumb() calls
      in templates) — removed it entirely.
    tasks:
      - id: "4.1"
        name: Write single-program.php
        status: done
        type: ai
        note: >
          Follows the detail page template order from the prototype CLAUDE.md exactly:
          1. Yoast breadcrumb
          2. H1 (post title) + subtitle (level · season)
          3. Key details section — age_label, tryout_required, format, venue, date_range
             (each rendered as h2.h6.fw-semibold + p pair, only if field populated)
          4. Pricing — if costs repeater has rows, render grade-cost table;
             if cost_tiers has rows, render two-column tiered table
          5. Schedule — if schedule_practices.day or schedule_games.day populated
          6. Sessions — if sessions repeater has rows
          7. Notes — if notes field populated, render callout box
          8. Financial aid — if show_financial_aid checked, pull text from options
          9. Registration block — if registration_url_boys/girls: Pattern B (two buttons);
             elif registration_url_boys: Pattern A (single button)
          10. Contact footer + back link
          All Bootstrap 5 utility classes. No custom CSS beyond index.css conventions.
          Code already existed in the pre-built scaffold and matches this order exactly.
          Deviation from deliverables: schedule and registration logic is inline in
          single-program.php rather than split into template-parts/program-registration.php
          and program-schedule.php — no other template currently includes those files
          (archive-camp-session.php is also self-contained), so the split was left
          as-is rather than refactoring working code with no current consumer.

      - id: "4.2"
        name: Create a test program post to verify template
        status: done
        type: ai
        note: >
          Create one program via WP-CLI with enough fields to exercise the full template:
          title, age_label, tryout_required, date_range, costs repeater,
          schedule_practices, schedule_games, show_financial_aid, registration_url_boys,
          registration_url_girls. Assign season=fall, level=competitive, location=rochester.
          Created post ID 38 ("Developmental Academy (Test)") via a WP-CLI eval-file
          script using carbon_set_post_meta() for repeater/group fields (raw wp post meta
          commands can't write Carbon Fields' complex-field storage format).
          URL: http://nsfc.ddev.site/program/developmental-academy-test-2/

      - id: "4.3"
        name: Verify template output
        status: done
        type: human
        note: Visit the test program's URL and confirm all sections render correctly and in the right order.

  # ───────────────────────────────────────────────────────────────────────────
  - id: 5
    name: Season Landing Pages
    goal: Build the 6 season-level hub pages (3 competitive, 3 recreational).
    type: ai
    status: done
    depends_on: 3
    deliverables:
      - wp-content/themes/nsfc-child/page-templates/season-landing.php
    tasks:
      - id: "5.1"
        name: Write season-landing.php page template
        status: done
        type: ai
        note: >
          Template that queries programs by season + level taxonomy and renders a
          responsive card grid (col-sm-6). Each card links to the program's permalink.
          Card shows: program title, age_label badge, post excerpt (description).
          Includes a season toggle tab bar at the top — three tabs linking to
          sibling season pages (Spring/Summer | Fall | Winter). Active tab uses btn-dark.
          Breadcrumb at the top via Yoast.
          Code already existed in the pre-built scaffold. Fixed one deviation from
          the project's card markup convention: the card link had
          `stretched-link text-decoration-none text-dark`, which CLAUDE.md explicitly
          flags as a common mistake — trimmed to `stretched-link` only.

      - id: "5.2"
        name: Assign page template and slugs to the 6 season pages
        status: done
        type: ai
        note: >
          Pages to configure:
          - /youth-soccer/competitive/spring-summer/ → level=competitive, season=spring-summer
          - /youth-soccer/competitive/fall/ → level=competitive, season=fall
          - /youth-soccer/competitive/winter/ → level=competitive, season=winter
          - /youth-soccer/recreational/spring-summer/ → level=recreational, season=spring-summer
          - /youth-soccer/recreational/fall/ → level=recreational, season=fall
          - /youth-soccer/recreational/winter/ → level=recreational, season=winter
          Use custom page meta to store which season+level to filter by.
          Created page IDs 39–44 via WP-CLI with page_template + _nsfc_season/_nsfc_level
          meta. Verified all 6 URLs resolve as specified and /youth-soccer/competitive/fall/
          renders correctly: season toggle with Fall active (btn-dark), the test program
          card, and breadcrumb.

  # ───────────────────────────────────────────────────────────────────────────
  - id: 6
    name: Static Pages — Home, Tryouts, UPSL, Store
    goal: Build all fully-authored static pages using Gutenberg + Kadence Blocks.
    type: ai
    status: in-progress
    depends_on: 3
    notes: >
      These pages are built with block JSON (importable via WP-CLI or the editor).
      Claude generates the raw block markup; paste into the WP editor's Code Editor view
      or import via WP-CLI's wp post meta update _gutenberg_blocks.

      DEVIATION: Built as raw Bootstrap HTML in post_content (matching every other
      template in this project) rather than Gutenberg/Kadence block JSON — simpler,
      consistent with the rest of the site, and avoids a block-JSON authoring step
      with no clear payoff for a POC.

      DEVIATION: Tasks 6.2 (Tryouts), 6.4 (UPSL Men's Team), 6.5 (UPSL Women's Team)
      are blocked — they require real content (exact tryout schedule/FAQ answers,
      12-player rosters, 10-game results, standings) that doesn't exist anywhere in
      this repo. The task notes reference real specifics (coach names, $450 fee, Dec 20
      tryout date) implying this data exists somewhere (northstarfc.com or the
      stakeholder), but fabricating rosters/scores for a real business isn't
      appropriate. User explicitly chose to skip these and proceed with everything
      else that has enough given information (2026-08-10).

      Also discovered mid-phase: Kadence's default page template auto-renders the
      post title as its own <h1> (entry-title), which doubled up with any custom H1
      placed in post_content. Fixed by setting post meta _kad_post_title = 'hide' on
      every page where custom Bootstrap-styled H1 content was authored (Home, UPSL,
      Soccer Store, Adult Soccer hub) so only one H1 renders. Left the Phase 3/6.9
      placeholder stub pages (Club, Resources, Events, Field Maps, Adult program
      pages) using Kadence's native title — they have no competing custom H1, so no
      conflict, and it's consistent with their bare "Details coming soon" treatment.

      Breadcrumbs on these plain pages use the [wpseo_breadcrumb] shortcode in
      post_content, since only fully custom PHP templates (single-program.php,
      season-landing.php) can call yoast_breadcrumb() directly.
    tasks:
      - id: "6.1"
        name: Home page
        status: done
        type: ai
        note: >
          Hero (H1: "The game. The community. The opportunity."), brief lead text,
          3 program cards (Youth Soccer, UPSL, Adult Soccer), location grid
          (4 location cards — Rochester links internally, others link to northstarfc.com),
          Returning families quick links (PlayMetrics, Uniforms, Field maps, Schedules, Contact).
          Created page ID 53, set as static front page (show_on_front=page). PlayMetrics/
          Uniforms/Schedules quick links point to northstarfc.com (no real account URLs
          exist in this repo) — Field maps and Contact link internally/mailto.

      - id: "6.2"
        name: Tryouts page
        status: blocked
        type: ai
        blocker: >
          Needs real content not available anywhere in this repo: exact tryout
          schedule dates/times, goalkeeper schedule, 5-step process copy, 5 FAQ
          answers, U9–U19 age chart values, registration dates. User chose to skip
          this and proceed with the rest of Phase 6 (2026-08-10).
        note: >
          Full static page: tryout schedule table (U11–U18 Boys/Girls, July 20–23),
          goalkeeper schedule, 5-step process, 5 FAQ accordions (Kadence),
          Academy section, U9–U19 age chart (TablePress), registration dates table,
          two register buttons (Boys → northstarfc.com, Girls → northstarfc.com).

      - id: "6.3"
        name: UPSL hub page
        status: done
        type: ai
        note: >
          Overview paragraph, program cards (Men's Team, Women's Team),
          season overview, fee table ($450 + extras), work-program discount detail,
          tryout details (Dec 20 at RCTC Dome), registration CTA.
          Built using only concretely given facts — where specifics weren't given
