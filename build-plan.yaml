      Phase 6.9 "Details coming soon" stubs, plus the still-blocked Tryouts/UPSL team
      pages) had no <h1> of their own — they relied entirely on Kadence's now-bypassed
      title bar for their heading. Applying plain.php to them directly would have
      given every one of those pages zero headings at all. Caught before it shipped
      by diffing post_content for `<h1` presence across all 44 candidate pages, not
      after the fact. Fixed by giving all 18 a real H1 (matching the display-6
      fw-bold pattern used everywhere else) plus a breadcrumb, keeping their "Details
      coming soon" placeholder text.
