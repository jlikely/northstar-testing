  # ───────────────────────────────────────────────────────────────────────────
  - id: 13
    name: QA & Polish
    goal: Verify the full site against the prototype's design constraints.
    type: ai
    status: in-progress
    depends_on: 12
    notes: >
      ADDENDUM (2026-08-10) — user reported "some landing pages are missing" after
      Phase 13 was reported done. Investigated: a database-wide HTTP status check of
      all 78 published pages/programs found zero 404s, so nothing was structurally
      missing — but pages 7 (Competitive) and 8 (Recreational), the two main cards
      linked from the Rochester hub, had completely empty post_content. They were
      created as bare stubs in Phase 3; every later phase built the season pages
      nested under them (Phase 5) or gave the sibling Camps hub real content
      (Phase 8 task 8.2), but nobody ever circled back to fill in these two
      intermediate hub pages themselves — a real gap that slipped through the
      Phase 13 audits because "does it 404" and "are headings/breadcrumbs/CTAs
      correct" don't catch "page loads fine but has no body content." Fixed by
      giving both the same intro + 3-season-card pattern already used for the
      Camps hub. Also fixed a small labeling bug found during the same pass: the
      bulk href-fix in the multi-location restructuring updated some back-links'
      destinations without updating their visible label text — "← Youth Soccer"
      links on the Camps hub and Find Your Program pages pointed at
      /youth-soccer/rochester/ (the Rochester hub) but still said "Youth Soccer"
      instead of "Rochester". Fixed both.
      Confirmed the pre-existing blank pages (Tryouts, UPSL Men's/Women's Team) are
      the already-documented, already-communicated blockers from Phase 6 — not new
      instances of this bug — and that all 6 season-landing.php pages are correctly
      empty by design (they render entirely from a dynamic program query, never
      from post_content).

      ADDENDUM 2 (2026-08-10) — user compared our cards against the React prototype's
      (RecreationalSeasonDetail.jsx / RecreationalLanding.jsx via the shared ProgramCard
      component) and found ours were missing description text. Confirmed by inspection:
      all 23 program posts had empty post_excerpt, so season-landing.php's existing
      `get_the_excerpt()` call (correct template logic, Phase 5) had nothing to render —
      not a template bug, a missing-data bug. Fixed:
        - Backfilled post_excerpt on all 23 program posts using each program's real
          `description` field from competitiveSeasons.js/recreationalPrograms.js
          (the same source data already used for Carbon Fields content in Phase 10).
        - Added date_range display to season-landing.php's card loop (Carbon Fields
          `date_range` meta was already populated but never rendered on cards) —
          matches the prototype's ProgramCard `dateRange` prop.
        - Backfilled post_excerpt on all 6 season-landing pages (39–44) with each
          season's real top-level `description` from the source data files, so the
          subtitle below the season toggle is no longer blank.
        - Rebuilt pages 7 (Competitive) and 8 (Recreational) — the two hub pages
          created blank in Phase 3, given real drill-down content this same day — to
          match CompetitiveLanding.jsx/RecreationalLanding.jsx: full intro paragraph(s)
          and 3 season cards showing date range + description, not just a bare season
          name link. That season-card metadata (dateRange/desc) is hardcoded in the
          prototype's landing components, not in the data files, so it was transcribed
          directly from source rather than derived.
      Checked the Camps hub (page 9) against its prototype equivalent
      (LocationCampsPage.jsx) and found it intentionally does NOT match — the
      prototype uses a dynamic filterable CampsList component, while Phase 8 explicitly
      chose the simpler "Option A — TablePress-style tables per season" approach
      instead. Left as-is; this is a documented deliberate simplification, not a gap.

      ADDENDUM 3 (2026-08-10) — user asked to move over the location write-ups from
      the prototype (YouthSoccer.jsx / LocationPage.jsx), asked whether this content
      is stored in a reusable data template, and asked to verify card CSS matches the
      prototype (the "after technique" — Bootstrap's stretched-link, which uses an
      ::after pseudo-element).

      Card CSS: found the real cause — Kadence's own theme CSS strips link styling
      site-wide (`h1 a`..`h6 a { color:inherit; text-decoration:none }` — matches
      every card title, since all card titles sit inside a heading — plus
      `.entry-content a { text-decoration:none }` for body links generally). The
      prototype has almost no custom card CSS of its own; it just doesn't have this
      problem. First fix attempt scoped the override to `.entry-content a` and
      verified server-side via curl — but the user reported it wasn't visible on
      /youth-soccer/, /youth-soccer/rochester/, or any season-landing.php page.
      Two real bugs, not one: (1) the theme version number wasn't bumped after
      editing style.css, so the enqueued URL (?ver=1.0.0) didn't change and browsers
      that had already loaded a page kept serving their cached copy — curl doesn't
      cache, so this was invisible to my own verification. (2) More importantly, the
      fix was scoped to the wrong ancestor: `.entry-content` only wraps pages using
      Kadence's DEFAULT page template. Every custom PHP template built across this
      entire project (season-landing.php, single-program.php, location-hub.php,
      location-chooser.php, archive-camp-session.php) bypasses that wrapper
      completely — so the original fix silently never applied to most of the site's
      cards, including the very pages the user was looking at. Confirmed by checking
      rendered HTML: both template types share one common ancestor,
      `<main id="inner-wrap">`, output by Kadence's header.php regardless of which
      template runs. Rescoped the rule to `main a:not(.btn):not(.nav-link):not(.dropdown-item)`
      (specificity still comfortably beats both Kadence rules) so it's now a
      genuinely universal, enforced pattern rather than a per-page-type patch. Also
      added a breadcrumb exclusion (`main .breadcrumb a` / `main nav[aria-label="Breadcrumb"] a`)
      matching the prototype's Breadcrumb.jsx, which doesn't underline crumb links.
      Bumped the theme version to 1.0.2 across both fix iterations to force cache-busting.
      SEPARATE FINDING, not yet fixed: the prototype's Breadcrumb.jsx uses proper
      Bootstrap markup (`<ol class="breadcrumb"><li class="breadcrumb-item">`), while
      our WP breadcrumbs use Yoast's own `<span>`-based output (via yoast_breadcrumb()/
      [wpseo_breadcrumb]) or the custom taxonomy-based breadcrumb built for
      single-program.php in Phase 13's audit — neither matches Bootstrap's semantic
      structure. Full parity would mean replacing Yoast's breadcrumb output sitewide
      with hand-built <ol>/<li> markup — a bigger, deliberately-deferred change,
      flagged for a future pass rather than done reflexively here.

      Data architecture / reusability: confirmed the prototype itself does NOT use a
      shared reusable data file for this content either — LocationPage.jsx and
      YouthSoccer.jsx each hardcode their own locationData/locations objects inline
      (root CLAUDE.md already documented this: "Location data... is defined inline in
      each page... not imported from a shared file"). Our WP build previously did the
      same thing, worse: every location's hub page was a separate hand-written HTML
      blob with no shared source at all. Fixed by building an actual centralized,
      reusable setup — better than the prototype's own pattern, not just matching it:
        - inc/location-data.php: three functions (nsfc_location_data(), returning
          label/intro/short_desc per location slug; nsfc_location_programs(), the 4
          shared "Programs in X" cards with {location} token substitution;
          nsfc_location_registered_links(), the 4 "Already registered?" shortcuts —
          now using the prototype's real URLs, e.g.
          northstarfc.com/resources/playmetrics-help/, instead of the generic
          northstarfc.com placeholder used earlier in Phase 6/12) — one place to edit,
          used by every location page.
        - page-templates/location-hub.php: replaces the hand-written HTML previously
          on pages 100/116/120/124 (Rochester/Austin/Albert Lea/Winona). Reads
          _nsfc_location page meta, renders everything from the shared data functions.
          Conditionally shows a "Not sure where to start?" Opportunity Finder CTA only
          when that location has its own Find Your Program page (currently just
          Rochester) — checked live via get_page_by_path(), not hardcoded.
        - page-templates/location-chooser.php: replaces page 6's hand-written HTML.
          Same data source, so the location labels/descriptions here and on each
          location's own hub page can't drift out of sync.
        - Adding a 5th location going forward: one entry in inc/location-data.php +
          one WP page assigned the "Location Hub" template with _nsfc_location set —
          no new template code, no hand-written HTML page.
      Home page's 4 location cards could not be converted the same way (Home uses
      Kadence's default page template, not a custom PHP one, so it can't call these
      PHP functions from post_content) — backfilled the same real short_desc text by
      hand instead. This is the one place the content is duplicated rather than
